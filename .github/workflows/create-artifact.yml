name: Build patch

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

jobs:
  publish-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run the Docker build
        id: build
        run: docker run --name builder thastegartivelis/oreshika-builder
      - name: Get filename
        id: filename
        run: echo "filename=$(docker logs builder)" >> $GITHUB_OUTPUT
      - name: Get the patch
        run: docker cp builder:/${{ steps.filename.outputs.filename }} ./${{ steps.filename.outputs.filename }}
      - name: Create Git Tag via API
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ steps.date.outputs.date }}'; // Define your tag name here
            const sha = context.sha;   // Targets the commit SHA that triggered the workflow

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              });
              console.log(`Successfully created tag ${tagName} on SHA ${sha}`);
            } catch (error) {
              console.error(`Failed to create tag: ${error.message}`);
              core.setFailed(error.message);
            }
      - name: Release patch
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.filename.outputs.filename }}
          tag_name: ${{ steps.date.outputs.date }}
          name: release-${{ steps.date.outputs.date }}
      - name: Upload patch
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          compression-level: 0

