name: Build patch

on:
  workflow_dispatch:

jobs:
  docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: Run the Docker build
        id: build
        run: echo "filename=$(docker run --name builder thastegartivelis/oreshika-builder)" >> $GITHUB_OUTPUT
      - name: Get the patch
        run: docker cp builder:${{ steps:build:outputs:filename }} ${{ steps:build:outputs:filename }}
      - name: Upload patch
        uses: actions/upload-artifact@v7
          with:
            name: ${{ steps:build:outputs:filename }}
            path: ${{ steps:build:outputs:filename }}
            compression-level: 0

