name: Build patch

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

jobs:
  set-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get-date.outputs.date }}
    steps:
      - name: Get date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%dT%H%M%SZ')" >> $GITHUB_OUTPUT
  generate-and-release-patch:
    runs-on: ubuntu-latest
    needs: set-date

    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run the Docker build
        id: build
        run: docker run --name builder thastegartivelis/oreshika-builder
      - name: Get filename
        id: filename
        run: echo "filename=$(docker logs builder)" >> $GITHUB_OUTPUT
      - name: Get the patch
        run: docker cp builder:/${{ steps.filename.outputs.filename }} ./${{ steps.filename.outputs.filename }}
      - name: Check for file changes via cache
        id: cache-check
        uses: actions/cache@v6
        with:
          path: .hash-cache-placeholder
          key: hash-${{ hashFiles(steps.filename.outputs.filename) }}
      - name: Create hash file
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          mkdir -p .hash-cache-placeholder
          touch .hache-cache-placeholder/file
      - name: Create tag
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          git -c user.name="autocommit" -c user.email="autocommit@autocommit.autocommit" commit --allow-empty -m "empty commit" 
          git tag v${{ needs.set-date.outputs.date }}
          git push origin v${{ needs.set-date.outputs.date }}
      - name: Release patch
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.filename.outputs.filename }}
          tag_name: ${{ needs.set-date.outputs.date }}
          name: release-${{ needs.set-date.outputs.date }}
      - name: Upload patch
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          compression-level: 0
