name: Build patch

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

jobs:
  publish-patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%dT%H%M%SZ')" >> $GITHUB_OUTPUT
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run the Docker build
        id: build
        run: docker run --name builder thastegartivelis/oreshika-builder
      - name: Get filename
        id: filename
        run: echo "filename=$(docker logs builder)" >> $GITHUB_OUTPUT
      - name: Get the patch
        run: docker cp builder:/${{ steps.filename.outputs.filename }} ./${{ steps.filename.outputs.filename }}
      - name: Create tag
        run: |
          git init
          git -c user.name="autocommit" -c user.email="autocommit@autocommit.autocommit" commit --allow-empty -m "empty commit" 
          git tag v${{ steps.date.outputs.date }}
          git push origin v${{ steps.date.outputs.date }}
      - name: Release patch
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.filename.outputs.filename }}
          tag_name: ${{ steps.date.outputs.date }}
          name: release-${{ steps.date.outputs.date }}
      - name: Upload patch
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.filename.outputs.filename }}
          path: ${{ steps.filename.outputs.filename }}
          compression-level: 0

